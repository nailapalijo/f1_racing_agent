
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX 3D Racing World</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    font-family: Arial, sans-serif;
}
canvas { display: block; }
#hud {
    position: absolute;
    top: 25px;
    left: 30px;
    color: white;
    z-index: 5;
    pointer-events: none;
}
.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 5px;
}
.logo span { color: #ff2020; }
.subtitle {
    color: #aab3c5;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 6px;
}
#status {
    position: absolute;
    bottom: 25px;
    left: 30px;
    color: #ff3434;
    font-size: 11px;
    letter-spacing: 3px;
    z-index: 5;
}
#speed {
    position: absolute;
    right: 30px;
    bottom: 25px;
    color: white;
    text-align: right;
    z-index: 5;
}
#speed strong {
    display: block;
    font-size: 38px;
    color: #ff3030;
}
#speed small {
    letter-spacing: 3px;
    color: #aab3c5;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<div id="hud">
    <div class="logo">APEX<span>.</span></div>
    <div class="subtitle">RACING INTELLIGENCE</div>
</div>
<div id="status">● LIVE 3D RACING SIMULATION</div>
<div id="speed">
    <strong id="speedValue">312</strong>
    <small>KM/H • SIMULATED</small>
</div>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b15);
scene.fog = new THREE.Fog(0x070b15, 65, 230);

const camera = new THREE.PerspectiveCamera(
    48, window.innerWidth / window.innerHeight, 0.1, 600
);
camera.position.set(0, 15, 32);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0x91a9d8, 0x15151b, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(-25, 40, 20);
keyLight.castShadow = true;
scene.add(keyLight);

const redLight = new THREE.PointLight(0xff1717, 150, 80);
redLight.position.set(0, 10, -12);
scene.add(redLight);

// GROUND
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x101a18, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

// TRACK PATH
const points = [
    new THREE.Vector3(-24, 0, 0),
    new THREE.Vector3(-20, 0, -12),
    new THREE.Vector3(-9, 0, -18),
    new THREE.Vector3(10, 0, -18),
    new THREE.Vector3(23, 0, -9),
    new THREE.Vector3(24, 0, 5),
    new THREE.Vector3(15, 0, 17),
    new THREE.Vector3(-5, 0, 19),
    new THREE.Vector3(-22, 0, 12)
];

const trackCurve = new THREE.CatmullRomCurve3(points, true);
const divisions = 500;
const roadWidth = 10;
const roadVertices = [];
const roadIndices = [];

for (let i = 0; i <= divisions; i++) {
    const t = i / divisions;
    const p = trackCurve.getPointAt(t);
    const tangent = trackCurve.getTangentAt(t);
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

    const left = p.clone().addScaledVector(side, roadWidth / 2);
    const right = p.clone().addScaledVector(side, -roadWidth / 2);

    roadVertices.push(left.x, 0.02, left.z);
    roadVertices.push(right.x, 0.02, right.z);

    if (i < divisions) {
        const n = i * 2;
        roadIndices.push(n, n + 1, n + 2);
        roadIndices.push(n + 1, n + 3, n + 2);
    }
}

const roadGeometry = new THREE.BufferGeometry();
roadGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(roadVertices, 3)
);
roadGeometry.setIndex(roadIndices);
roadGeometry.computeVertexNormals();

const road = new THREE.Mesh(
    roadGeometry,
    new THREE.MeshStandardMaterial({
        color: 0x24272d,
        roughness: 0.88,
        side: THREE.DoubleSide
    })
);
road.receiveShadow = true;
scene.add(road);

// TRACK EDGE LINES
function makeEdge(offset, color) {
    const pts = [];
    for (let i = 0; i <= 400; i++) {
        const t = i / 400;
        const p = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t);
        const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
        p.addScaledVector(side, offset);
        p.y = 0.09;
        pts.push(p);
    }
    const line = new THREE.Mesh(
        new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(pts),
            400, 0.12, 6, false
        ),
        new THREE.MeshStandardMaterial({
            color,
            emissive: color,
            emissiveIntensity: 0.3
        })
    );
    scene.add(line);
}
makeEdge(5.15, 0xff2020);
makeEdge(-5.15, 0xffffff);

// F1 CAR
const car = new THREE.Group();
scene.add(car);

const redPaint = new THREE.MeshStandardMaterial({
    color: 0xd50920,
    metalness: 0.55,
    roughness: 0.27
});
const blackPaint = new THREE.MeshStandardMaterial({
    color: 0x080a10,
    metalness: 0.45,
    roughness: 0.35
});
const carbon = new THREE.MeshStandardMaterial({
    color: 0x171a20,
    metalness: 0.4,
    roughness: 0.55
});
const glass = new THREE.MeshStandardMaterial({
    color: 0x07111e,
    metalness: 0.8,
    roughness: 0.12
});

function addBox(parent, size, pos, material) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(...size), material
    );
    mesh.position.set(...pos);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

function addWheel(x, z) {
    const wheel = new THREE.Group();
    wheel.position.set(x, 0.53, z);

    const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(0.52, 0.52, 0.34, 32),
        new THREE.MeshStandardMaterial({
            color: 0x080808, roughness: 0.95
        })
    );
    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheel.add(tire);

    const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(0.23, 0.23, 0.36, 24),
        new THREE.MeshStandardMaterial({
            color: 0x777b83, metalness: 0.9, roughness: 0.25
        })
    );
    hub.rotation.z = Math.PI / 2;
    wheel.add(hub);

    car.add(wheel);
    return wheel;
}

// Main chassis
addBox(car, [1.65, 0.38, 4.2], [0, 0.72, 0], redPaint);
addBox(car, [1.25, 0.3, 1.4], [0, 0.91, -0.15], redPaint);

// Nose
const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.48, 2.8, 4),
    redPaint
);
nose.rotation.x = Math.PI / 2;
nose.position.set(0, 0.72, 2.35);
nose.scale.set(1, 1, 0.48);
nose.castShadow = true;
car.add(nose);

// Cockpit
const cockpit = new THREE.Mesh(
    new THREE.SphereGeometry(0.72, 32, 20),
    glass
);
cockpit.scale.set(0.72, 0.53, 1.0);
cockpit.position.set(0, 1.15, -0.45);
car.add(cockpit);

// Rear engine cover
addBox(car, [0.85, 0.45, 1.25], [0, 0.98, -1.25], redPaint);

// Front and rear wings
addBox(car, [3.5, 0.12, 0.48], [0, 0.56, 2.75], blackPaint);
addBox(car, [3.2, 0.16, 0.5], [0, 1.12, -2.05], redPaint);
addBox(car, [0.15, 0.9, 0.13], [0, 1.45, -2.1], blackPaint);

// Wing endplates
for (const x of [-1.55, 1.55]) {
    addBox(car, [0.12, 0.5, 0.55], [x, 0.7, 2.7], redPaint);
}

// Wheels
const wheels = [
    addWheel(-1.0, 1.75),
    addWheel(1.0, 1.75),
    addWheel(-1.0, -1.65),
    addWheel(1.0, -1.65)
];

// Side pods
for (const x of [-0.83, 0.83]) {
    addBox(car, [0.45, 0.45, 1.65], [x, 0.72, -0.55], redPaint);
}

// Rear diffuser
addBox(car, [1.5, 0.2, 0.5], [0, 0.38, -2.25], carbon);

// Grandstands
const standMaterial = new THREE.MeshStandardMaterial({
    color: 0x202634, roughness: 0.85
});
for (const side of [-1, 1]) {
    for (let i = 0; i < 13; i++) {
        const stand = new THREE.Mesh(
            new THREE.BoxGeometry(3.3, 3 + (i % 3) * 0.5, 5),
            standMaterial
        );
        stand.position.set(
            side * (29 + (i % 3) * 1.2),
            1.5,
            -23 + i * 4
        );
        stand.castShadow = true;
        scene.add(stand);
    }
}

// STADIUM FLOODLIGHTS
for (let i = 0; i < 12; i++) {
    const x = (i % 2 === 0 ? -1 : 1) * 34;
    const z = -24 + Math.floor(i / 2) * 10;

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.2, 13, 8),
        blackPaint
    );
    pole.position.set(x, 6.5, z);
    scene.add(pole);

    const lamp = new THREE.PointLight(0xe2edff, 180, 38);
    lamp.position.set(x, 13, z);
    scene.add(lamp);

    const bulb = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.3, 0.7),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    bulb.position.copy(lamp.position);
    scene.add(bulb);
}

// Track-side light markers
for (let i = 0; i < 55; i++) {
    const p = trackCurve.getPointAt(i / 55);
    const marker = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.6, 0.3),
        new THREE.MeshBasicMaterial({ color: 0xff2020 })
    );
    marker.position.set(p.x + 6, 0.3, p.z);
    scene.add(marker);
}

// ANIMATION
const clock = new THREE.Clock();
let progress = 0;

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.04);
    progress = (progress + delta * 0.045) % 1;

    const position = trackCurve.getPointAt(progress);
    const tangent = trackCurve.getTangentAt(progress);

    car.position.set(position.x, 0, position.z);
    car.rotation.y = Math.atan2(tangent.x, tangent.z);

    wheels.forEach(w => {
        w.rotation.x += delta * 22;
    });

    // Chase camera
    const behind = new THREE.Vector3(
        -tangent.x * 11,
        6,
        -tangent.z * 11
    );
    const cameraTarget = position.clone().add(behind);
    camera.position.lerp(cameraTarget, 0.045);
    camera.lookAt(position.x, 0.8, position.z);

    redLight.position.x = Math.sin(clock.elapsedTime * 0.5) * 15;

    document.getElementById("speedValue").textContent =
        Math.round(285 + Math.sin(clock.elapsedTime * 2) * 28);

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
